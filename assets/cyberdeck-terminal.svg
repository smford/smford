<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FCEE0A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, 'Cascadia Code', monospace; }
    .title-text { font-size: 12px; fill: #6b8299; letter-spacing: 1px; }
    .prompt-label { font-size: 13px; font-weight: bold; }
    .field-label { font-size: 12px; font-weight: bold; fill: #FCEE0A; letter-spacing: 0.5px; }
    .field-val { font-size: 12px; fill: #FFFFFF; font-weight: 500; }
    .hud-label { font-size: 11px; fill: #6b8299; font-weight: bold; letter-spacing: 1px; }
    .hud-val { font-size: 11px; font-weight: bold; }
  </style>

  <!-- Outer Black Card Container -->
  <rect x="2" y="2" width="836" height="446" rx="8" fill="#06080e" stroke="url(#cyberBorder)" stroke-width="1.8"/>

  <!-- Subtle Cyberdeck Grid Background -->
  <line x1="30" y1="46" x2="810" y2="46" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="30" y1="320" x2="810" y2="320" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Top Window Header Bar -->
  <rect x="2" y="2" width="836" height="38" rx="8" fill="#0d121c"/>
  <rect x="2" y="32" width="836" height="8" fill="#0d121c"/>
  <line x1="2" y1="40" x2="838" y2="40" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Terminal Window Controls -->
  <circle cx="24" cy="20" r="5" fill="#FF003C"/>
  <circle cx="42" cy="20" r="5" fill="#FCEE0A"/>
  <circle cx="60" cy="20" r="5" fill="#00F0FF"/>

  <text x="82" y="24" class="mono title-text">smford@mainframe: ~ (bash/netrunner) // TTY1_ONLINE</text>
  
  <!-- Right Status Beacon (Using text-anchor end with bullet for zero overlay) -->
  <text x="814" y="24" text-anchor="end" class="mono" font-size="11" font-weight="bold" fill="#00FF66" letter-spacing="1px">● SEC_NET: ACTIVE</text>

  <!-- Command Line Prompt -->
  <text x="36" y="72" class="mono prompt-label">
    <tspan fill="#FCEE0A">smford@mainframe</tspan><tspan fill="#6b8299">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#FFFFFF">$ neofetch --cyberdeck</tspan>
  </text>

  <!-- Neofetch Telemetry Key-Values -->
  <g class="mono">
    <!-- Row 1: OPERATOR -->
    <text x="44" y="106">
      <tspan class="field-label">OPERATOR:   </tspan>
      <tspan class="field-val">Steve Ford (@smford)</tspan>
    </text>

    <!-- Row 2: ROLE -->
    <text x="44" y="128">
      <tspan class="field-label">ROLE:       </tspan>
      <tspan class="field-val">Site Reliability Engineer &amp; Hardware Prototyper</tspan>
    </text>

    <!-- Row 3: FOCUS -->
    <text x="44" y="150">
      <tspan class="field-label">FOCUS:      </tspan>
      <tspan class="field-val">High-Scale Reliability, Zero-Alloc Go CLIs, IoT Cyberware</tspan>
    </text>

    <!-- Row 4: UPTIME -->
    <text x="44" y="172">
      <tspan class="field-label">UPTIME:     </tspan>
      <tspan class="field-val">20+ Years Continuous Systems &amp; Infrastructure Engineering</tspan>
    </text>

    <!-- Row 5: NETWORK -->
    <text x="44" y="194">
      <tspan class="field-label">NETWORK:    </tspan>
      <tspan class="field-val">Bay Area Grid // UK Matrix Nodes</tspan>
    </text>

    <!-- Row 6: HARDWARE -->
    <text x="44" y="216">
      <tspan class="field-label">HARDWARE:   </tspan>
      <tspan class="field-val">ESP32 Xtensa Dual-Core, Raspberry Pi Zero/CM4, Bambu Lab X1C</tspan>
    </text>

    <!-- Row 7: INFRA -->
    <text x="44" y="238">
      <tspan class="field-label">INFRA:      </tspan>
      <tspan class="field-val">Debian Linux, Kubernetes RBAC, Terraform, MikroTik, UniFi PoE</tspan>
    </text>

    <!-- Row 8: SHELL -->
    <text x="44" y="260">
      <tspan class="field-label">SHELL:      </tspan>
      <tspan class="field-val">zsh 5.9 / Bash 5.2 / Neovim 0.10 / iTerm2 OSC 1337 / tmux</tspan>
    </text>

    <!-- Row 9: TELEMETRY -->
    <text x="44" y="282">
      <tspan class="field-label">TELEMETRY:  </tspan>
      <tspan class="field-val">SNMPv3, TICK Stack, v4l2rtspserver, LittleFS/SPIFFS</tspan>
    </text>
  </g>

  <!-- Bottom Telemetry HUD Box -->
  <rect x="24" y="332" width="792" height="96" rx="4" fill="#04060a" stroke="#00F0FF" stroke-opacity="0.3" stroke-dasharray="4,4"/>

  <g class="mono">
    <!-- Telemetry Row 1 -->
    <text x="44" y="360">
      <tspan class="hud-label">KERNEL: </tspan><tspan class="hud-val" fill="#00FF66">6.1.0-DEBIAN-SMP</tspan>
      <tspan dx="50" class="hud-label">CODEC: </tspan><tspan class="hud-val" fill="#00F0FF">H.264 / RTSP 120ms</tspan>
      <tspan dx="50" class="hud-label">SECURITY: </tspan><tspan class="hud-val" fill="#FF003C">UNRESTRICTED ICE</tspan>
    </text>

    <!-- Telemetry Row 2 -->
    <text x="44" y="386">
      <tspan class="hud-label">NODES:  </tspan><tspan class="hud-val" fill="#FCEE0A">150+ REPOSITORIES</tspan>
      <tspan dx="42" class="hud-label">COMPILER: </tspan><tspan class="hud-val" fill="#00F0FF">Go 1.23 / C++20</tspan>
      <tspan dx="72" class="hud-label">FABRICATION: </tspan><tspan class="hud-val" fill="#FFFFFF">Bambu PETG-CF / CNC</tspan>
    </text>

    <!-- Telemetry Row 3 -->
    <text x="44" y="412">
      <tspan fill="#00F0FF" font-weight="bold" font-size="11">&gt;&gt; MAINFRAME PROTOCOL: </tspan>
      <tspan fill="#FCEE0A" font-weight="bold" font-size="11">https://smford.github.io/</tspan>
      <tspan dx="25" fill="#6b8299" font-size="11">[PORTFOLIO &amp; HARDWARE DOSSIER]</tspan>
    </text>
  </g>
</svg>
